name: Build Jarvis APK

on:
  push:
    branches: [jarvis-apk]
    paths: ['jarvis-android/**', '.github/workflows/jarvis-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarvis-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Clé de signature fixe (si les secrets existent)
        env:
          B64: ${{ secrets.JARVIS_KEYSTORE_B64 }}
        run: |
          if [ -n "$B64" ]; then
            echo "$B64" | base64 -d > "$RUNNER_TEMP/jarvis.keystore"
            echo "JARVIS_KEYSTORE_PATH=$RUNNER_TEMP/jarvis.keystore" >> "$GITHUB_ENV"
            echo "Signature : clé fixe Jarvis"
          else
            echo "::warning::Secrets JARVIS_KEYSTORE_* absents : signature debug (mise à jour = désinstaller d'abord)"
          fi
      - name: Build APK
        env:
          JARVIS_KEYSTORE_PASSWORD: ${{ secrets.JARVIS_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk Adria.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-apk
          path: jarvis-android/Adria.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="adria-v1.8-${{ github.run_number }}"
          gh release create "$TAG" Adria.apk --target "${{ github.sha }}" --title "Adria $TAG" --notes "APK Jarvis (signature debug, sideload)." --prerelease

name: Build Jarvis APK

on:
  push:
    branches: [jarvis-apk]
    paths: ['jarvis-android/**', '.github/workflows/jarvis-apk.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarvis-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build APK
        run: gradle --no-daemon assembleRelease
      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk Jarvis.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-apk
          path: jarvis-android/Jarvis.apk

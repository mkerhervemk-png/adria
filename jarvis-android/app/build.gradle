plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.kerherve.jarvis'
    compileSdk 35

    defaultConfig {
        applicationId 'fr.kerherve.jarvis'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '1.5'
    }

    signingConfigs {
        // Clé fixe fournie par les secrets GitHub (JARVIS_KEYSTORE_B64 / JARVIS_KEYSTORE_PASSWORD).
        // Sans ces secrets, on retombe sur la clé debug de la machine de compilation.
        jarvis {
            def ks = System.getenv('JARVIS_KEYSTORE_PATH')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('JARVIS_KEYSTORE_PASSWORD')
                keyAlias 'jarvis'
                keyPassword System.getenv('JARVIS_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('JARVIS_KEYSTORE_PATH') ? signingConfigs.jarvis : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.car.app:app:1.4.0'
    implementation 'androidx.core:core:1.13.1'
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22') // aligne kotlin-stdlib-jdk7/jdk8
}

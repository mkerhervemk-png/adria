plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.kerherve.jarvis'
    compileSdk 35

    defaultConfig {
        applicationId 'fr.kerherve.jarvis'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signé avec la clé debug : installable directement (sideload), pas pour le Play Store.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
